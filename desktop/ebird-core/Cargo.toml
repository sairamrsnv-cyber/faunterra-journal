[package]
name    = "ebird-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "eBird archive builder — fetch, sanitise, store, analyse."

[dependencies]
serde.workspace      = true
serde_json.workspace = true
chrono.workspace     = true
tokio.workspace      = true
reqwest.workspace    = true

[[bin]]
name = "pull"
path = "src/bin/pull.rs"

# A local stand-in that speaks eBird's response shape. Exists so the pull path
# can be exercised end to end — real sockets, real HTTP, real parsing, real
# disk — without spending API quota or needing the network.
[[bin]]
name = "fixture"
path = "src/bin/fixture.rs"

# The website's field-signals digest. Runs in CI; writes data/ebird-signals.json.
[[bin]]
name = "signals"
path = "src/bin/signals.rs"

# Installs the daily pull as a launchd agent. Carries no secrets.
[[bin]]
name = "schedule"
path = "src/bin/schedule.rs"

# Turns the archive into tidy CSVs for pandas / R. Never writes to the archive.
[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"
